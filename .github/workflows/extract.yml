name: Extract newsletters

on:
  # Daily, so a new issue linked on the Newsletters page is searchable by the
  # next morning. GitHub pauses schedules in public repos after 60 days with
  # no repository activity (e.g. a summer with no new issues); re-enable it
  # from the Actions tab.
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 3:17 or 4:17 Vancouver time
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new issues to process (blank = all)"
        required: false
        default: ""

permissions:
  contents: write   # to commit extracted text back to the repo
  issues: write     # link check records findings as GitHub issues

env:
  PYTHONUNBUFFERED: "1"   # show per-issue progress live in the Actions log

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Fail fast if OCR is not working (a wrong tessdata path silently yields
      # 0 OCR pages). sample.pdf has one text page and one scanned page.
      - name: OCR self-test
        run: |
          out=$(python scripts/extract.py --pdf tests/sample.pdf --id 999)
          rm -f data/issues/999.json
          echo "$out"
          echo "$out" | grep -q "'ocr_pages': 1" || { echo "OCR self-test failed"; exit 1; }

      - name: Harvest catalog from the Newsletters page
        run: python scripts/harvest.py

      - name: Extract text from new issues
        env:
          LIMIT: ${{ inputs.limit }}
        run: python scripts/extract.py ${LIMIT:+--limit "$LIMIT"}

      # Runs even if extraction partly failed, so completed issues are kept
      # and never re-OCR'd.
      - name: Commit extracted text
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract newsletters (run ${{ github.run_number }})"
            git push
          fi

      # Reports likely wrong links on the Newsletters page as warnings on the
      # run summary and as GitHub issues (label link-check), one per link,
      # never repeated; closes them once fixed. Does not fail the run; see
      # scripts/check.py and scripts/alerts.py.
      - name: Check newsletter links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check.py --github
