name: Build and deploy search site

# Runs when an extraction run has committed new data (called from
# extract.yml; its commits use GITHUB_TOKEN and so trigger no push events),
# when the site code changes, or by hand.
on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Secrets cannot be tested directly in `if:`; expose whether it is set.
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest data, including the extraction run's commit

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Pagefind index and search page
        run: npm run build

      - name: Skip deploy (Cloudflare secrets not set)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; site built but not deployed."

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.140.0"
          command: deploy
